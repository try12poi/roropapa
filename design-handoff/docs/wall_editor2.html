<style>
:root{--ink:#0E1420;--panel:#18202E;--line:#2A3546;--fluor:#7FE3F0;--text:#DCE5EE;--muted:#8A99AB}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--text);font-family:"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;-webkit-user-select:none;user-select:none}
header{padding:10px 14px;text-align:center;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:16px;color:#F3F8FC}
header p{margin:4px 0 0;font-size:12px;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:8px}
.tool{border:2px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;padding:8px 11px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.tool.on{border-color:var(--fluor);box-shadow:0 0 0 2px rgba(127,227,240,.25)}
.tool .dot{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.act{border:1px solid var(--line);background:#212B3B;color:var(--text);border-radius:8px;padding:8px 11px;font-size:12.5px;cursor:pointer;font-family:inherit}
.act.primary{background:var(--fluor);color:#0A0E17;font-weight:800;border:none}
#wrap{position:relative;margin:8px auto;width:max-content;max-width:100%;overflow:auto}
canvas{display:block;background:#000;touch-action:none;border-radius:6px;max-width:100%}
.hint{text-align:center;font-size:12px;color:var(--muted);padding:0 14px 8px}
.hint b{color:var(--fluor)}
#out{width:calc(100% - 24px);margin:0 12px 14px;height:110px;background:#0A0E17;color:#9fe;border:1px solid var(--line);border-radius:8px;padding:10px;font-family:ui-monospace,monospace;font-size:11px;display:none}
.count{font-size:12px;color:var(--muted)}
</style>
<header>
  <h1>🧱 안심24 — 벽·사물·사다리·벙커 그리기</h1>
  <p>이미 그린 것들은 불러와 있어요. <b style="color:#7FE3F0">사다리 추가</b> + <b style="color:#7FE3F0">벙커입구 위치</b>만 잡으면 됩니다</p>

function pos(e){const r=cv.getBoundingClientRect();const p=e.touches?e.touches[0]:e;return{x:(p.clientX-r.left)/scale,y:(p.clientY-r.top)/scale};}
function down(e){const p=pos(e);
  if(tool==='erase'){for(let i=rects.length-1;i>=0;i--){const R=rects[i];if(p.x>=R.x&&p.x<=R.x+R.w&&p.y>=R.y&&p.y<=R.y+R.h){rects.splice(i,1);refresh();break;}}return;}
  drag={sx:p.x,sy:p.y,x:p.x,y:p.y};e.preventDefault();}
function move(e){if(!drag)return;const p=pos(e);drag.x=p.x;drag.y=p.y;draw();e.preventDefault();}
function up(e){if(!drag)return;const x1=Math.min(drag.sx,drag.x),y1=Math.min(drag.sy,drag.y),w=Math.abs(drag.x-drag.sx),h=Math.abs(drag.y-drag.sy);
